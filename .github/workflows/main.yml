name: Download and Commit File

# ワークフローを手動で実行できるようにします (Actionsタブから)
on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    # リポジトリにコミットをプッシュするために書き込み権限が必要です
    permissions:
      contents: write

    steps:
      # 1. リポジトリのコードをチェックアウトします
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. curl を使ってファイルをダウンロードします
      #    -L: リダイレクトをたどる
      #    -o: 出力ファイル名を指定 (URLの#以降から取得)
      - name: Download file
        run: |
          curl -L -o "lolit_hyper_x-rated.s3m" "https://api.modarchive.org/downloads.php?moduleid=74080"

      # 3. ダウンロードしたファイルをリポジトリにコミット＆プッシュします
      #    stefanzweifel/git-auto-commit-action を使うと簡単です
      - name: Commit and push file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # コミットメッセージ
          commit_message: "CI: Add/update lolit_hyper_x-rated.s3m"
          
          # コミット対象のファイルパターン
          file_pattern: "lolit_hyper_x-rated.s3m"
